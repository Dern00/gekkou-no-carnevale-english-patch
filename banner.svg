<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title description">
  <title id="title">Gekkou no Carnevale</title>
  <desc id="description">English translation patch. Gold lettering beside Venetian Gothic arches and their reflections under a moonlit sky.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#170d19"/>
      <stop offset=".55" stop-color="#281321"/>
      <stop offset="1" stop-color="#3d232d"/>
    </linearGradient>
    <radialGradient id="light" cx=".77" cy=".4" r=".55">
      <stop stop-color="#ad7669" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ad7669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#271722"/>
      <stop offset="1" stop-color="#140d16"/>
    </linearGradient>
    <linearGradient id="water-edge">
      <stop stop-color="#000"/>
      <stop offset=".23" stop-color="#fff"/>
    </linearGradient>
    <mask id="reflection-edge"><rect x="555" y="185" width="445" height="65" fill="url(#water-edge)"/></mask>
    <mask id="crescent">
      <circle cx="794" cy="71" r="40" fill="#fff"/>
      <circle cx="806" cy="63" r="38" fill="#000"/>
    </mask>
    <linearGradient id="gold" x2="1" y2=".6">
      <stop stop-color="#c99166"/>
      <stop offset=".54" stop-color="#efd4a0"/>
      <stop offset="1" stop-color="#9b634e"/>
    </linearGradient>
    <clipPath id="panel"><rect width="1000" height="250" rx="15"/></clipPath>
    <path id="arch" d="M0 70V31C0 17 12 9 24 0c12 9 24 17 24 31v39"/>
    <path id="leaf" d="M0 0c-4-8-8-8-8-3s4 5 8 3c4 2 8 2 8-3S4-8 0 0Z"/>
  </defs>
  <g clip-path="url(#panel)">
