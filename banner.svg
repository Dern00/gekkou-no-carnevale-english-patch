      <use href="#arch" x="760" y="109"/>
      <use href="#arch" x="816" y="99"/>
      <use href="#arch" x="872" y="91"/>
      <use href="#arch" x="928" y="96"/>
      <path d="M704 151h48m8-11h48m8-10h48m8-8h48m8 5h48M676 181h324"/>
      <path d="M728 150v36m56-47v47m56-56v56m56-64v64m56-58v58" opacity=".6"/>
