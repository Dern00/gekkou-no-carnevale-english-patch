    <rect width="1000" height="250" fill="url(#light)"/>
    <circle cx="794" cy="71" r="56" fill="none" stroke="#d4ac83" stroke-opacity=".15"/>
    <circle cx="794" cy="71" r="40" fill="#dfba94" fill-opacity=".94" mask="url(#crescent)"/>
    <g fill="#e0b78a">
